<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crestBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Background -->
  <path d="M100 8 C145 8, 175 22, 175 60 C175 130, 130 178, 100 192 C70 178, 25 130, 25 60 C25 22, 55 8, 100 8 Z" 
        fill="url(#crestBlue)" stroke="url(#crestGold)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner Gold Inset Border -->
  <path d="M100 16 C140 16, 166 28, 166 62 C166 124, 126 168, 100 182 C74 168, 34 124, 34 62 C34 28, 60 16, 100 16 Z" 
        fill="#0f172a" stroke="url(#crestGold)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Torch / Flame of Enlightenment -->
  <g transform="translate(100, 48)">
    <!-- Torch handle -->
    <path d="M-4 12 L4 12 L2 24 L-2 24 Z" fill="url(#crestGold)"/>
    <path d="M-6 10 L6 10 L4 13 L-4 13 Z" fill="#fef08a"/>
    <!-- Flame outer -->
    <path d="M0 -18 C6 -10, 10 -4, 6 4 C2 10, -4 8, -6 3 C-9 -3, -4 -10, 0 -18 Z" fill="#ef4444"/>
    <!-- Flame core -->
    <path d="M0 -14 C3 -8, 6 -3, 3 3 C0 7, -3 5, -4 2 C-6 -2, -2 -8, 0 -14 Z" fill="#f59e0b"/>
    <path d="M0 -9 C2 -5, 3 -2, 1 1 C0 3, -1 3, -2 1 C-3 -1, -1 -5, 0 -9 Z" fill="#fef08a"/>
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(100, 88)">
    <!-- Left Page -->
    <path d="M-36 0 C-22 -4, -6 -2, 0 8 C-6 16, -22 14, -36 8 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M-34 3 C-22 -1, -8 0, -2 8 C-8 14, -22 12, -34 7 Z" fill="#f8fafc"/>
    <line x1="-30" y1="4" x2="-8" y2="2" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-30" y1="7" x2="-10" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-28" y1="10" x2="-12" y2="8" stroke="#94a3b8" stroke-width="1"/>

    <!-- Right Page -->
    <path d="M36 0 C22 -4, 6 -2, 0 8 C6 16, 22 14, 36 8 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M34 3 C22 -1, 8 0, 2 8 C8 14, 22 12, 34 7 Z" fill="#f8fafc"/>
    <line x1="30" y1="4" x2="8" y2="2" stroke="#94a3b8" stroke-width="1"/>
    <line x1="30" y1="7" x2="10" y2="5" stroke="#94a3b8" stroke-width="1"/>
    <line x1="28" y1="10" x2="12" y2="8" stroke="#94a3b8" stroke-width="1"/>

    <!-- Center Spine & Ribbon -->
    <path d="M-1 8 L1 8 L0 22 Z" fill="url(#crestGold)"/>
  </g>

  <!-- Laurel Wreath Branches -->
  <g stroke="url(#crestGold)" stroke-width="1.2" fill="none">
    <!-- Left wreath -->
    <path d="M42 98 Q40 128 65 146"/>
    <ellipse cx="43" cy="104" rx="3" ry="1.5" transform="rotate(-30 43 104)" fill="#f59e0b"/>
    <ellipse cx="44" cy="116" rx="3" ry="1.5" transform="rotate(-15 44 116)" fill="#f59e0b"/>
    <ellipse cx="49" cy="128" rx="3" ry="1.5" transform="rotate(10 49 128)" fill="#f59e0b"/>
    <ellipse cx="58" cy="138" rx="3" ry="1.5" transform="rotate(35 58 138)" fill="#f59e0b"/>

    <!-- Right wreath -->
    <path d="M158 98 Q160 128 135 146"/>
    <ellipse cx="157" cy="104" rx="3" ry="1.5" transform="rotate(30 157 104)" fill="#f59e0b"/>
    <ellipse cx="156" cy="116" rx="3" ry="1.5" transform="rotate(15 156 116)" fill="#f59e0b"/>
    <ellipse cx="151" cy="128" rx="3" ry="1.5" transform="rotate(-10 151 128)" fill="#f59e0b"/>
    <ellipse cx="142" cy="138" rx="3" ry="1.5" transform="rotate(-35 142 138)" fill="#f59e0b"/>
  </g>

  <!-- Lower Ribbon / Banner -->
  <g transform="translate(100, 150)">
    <path d="M-60 0 L60 0 L52 14 L0 12 L-52 14 Z" fill="url(#crestGold)" filter="url(#shadow)"/>
    <text x="0" y="9.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#0f172a" letter-spacing="1">
      PRINCE PUBLIC SCHOOL
    </text>
  </g>

  <!-- Year Estd badge -->
  <g transform="translate(100, 172)">
    <rect x="-24" y="-6" width="48" height="11" rx="5" fill="#1e3a8a" stroke="url(#crestGold)" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#fef08a" letter-spacing="0.5">
      ESTD. 1995
    </text>
  </g>

  <!-- Stars of Excellence -->
  <polygon points="100,22 101.5,25.5 105,25.8 102.3,28 103.1,31.5 100,29.6 96.9,31.5 97.7,28 95,25.8 98.5,25.5" fill="#fef08a"/>
  <polygon points="82,26 83.2,28.8 86,29 83.8,30.8 84.5,33.6 82,32 79.5,33.6 80.2,30.8 78,29 80.8,28.8" fill="#fef08a"/>
  <polygon points="118,26 119.2,28.8 122,29 119.8,30.8 120.5,33.6 118,32 115.5,33.6 116.2,30.8 114,29 116.8,28.8" fill="#fef08a"/>
</svg>
